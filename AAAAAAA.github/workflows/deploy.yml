name: Build and Deploy Live Chat

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Web
        working-directory: apps/web
        run: bunx tsc --noEmit

      - name: Lint Web
        working-directory: apps/web
        run: bun run lint

      - name: Typecheck Backend
        working-directory: apps/backend
        run: bunx tsc --noEmit

      - name: Generate Prisma Contract
        working-directory: apps/backend
        run: bun run contract:emit


  build-and-push:
    name: Build and Push Images
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://chat.dabelwal.online
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/deployments

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export CHAT_IMAGE_TAG="${{ github.sha }}"

            docker compose pull chat-backend chat-web

            docker compose up -d \
              --remove-orphans \
              chat-backend chat-web

            docker compose ps
